name: Build NameStyle Plus

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Projekt zusammenbauen
        run: bash assemble.sh

      - name: Kompilieren
        working-directory: _proj
        run: ./gradlew build --no-daemon

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NameStylePlus-jar
          path: |
            _proj/build/libs/*.jar
            !_proj/build/libs/*-sources.jar
