name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dateien einsortieren
        run: |
          mkdir -p src/main/java/dev/namestyle/mixin src/main/resources
          mv *Mixin.java src/main/java/dev/namestyle/mixin/ 2>/dev/null || true
          mv NameStyle*.java src/main/java/dev/namestyle/ 2>/dev/null || true
          mv fabric.mod.json namestyle.mixins.json src/main/resources/ 2>/dev/null || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NameStyle-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
